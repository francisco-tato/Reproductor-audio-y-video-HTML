<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
  <link rel="stylesheet" href="style.css?v=2">

<body class="hero">

        <div class="card">

            <video controls class="video-paulo">

            </video>
        </div>
        <div class="card">
            <h2>Paulo Londra - Necio (feat. LIT killah)</h2>
            <audio controls loop>
                <source src="video/necio.mp3" type="audio/mpeg">
            </audio>
        </div>
    </section>
    <p class="copyright">
        <img src="images/Copyright.png" alt="Logo FT">

    </p>
